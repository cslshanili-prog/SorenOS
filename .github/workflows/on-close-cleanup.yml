name: 關閉時清理流程標籤

# issue / PR 一關閉，就把「還在走流程」類的標籤摘掉，
# 已關閉列表裡不會再留著一堆 needs xxx。
on:
  issues:
    types: [closed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  remove-pending-labels:
    name: 摘掉 needs 系列標籤
    runs-on: ubuntu-latest
    steps:
      - name: 移除標籤
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          # 要摘掉的標籤，一行一個
          PENDING_LABELS: |
            needs triage
            needs info
            needs design
        run: |
          set -euo pipefail

          # 先看這條 issue / PR 現在掛著哪些標籤。沒掛的就不去刪，
          # 免得為「本來就沒有的標籤」報一次 404 把整個流程判成失敗。
          current=$(gh api "repos/$REPO/issues/$NUMBER/labels" --paginate --jq '.[].name')

          while IFS= read -r label; do
            [ -n "$label" ] || continue

            # 下面幾處 ${label} 的花括號不能省：變量緊挨著「」這類全角標點時，
            # bash 會把標點的字節也算進變量名，配上 set -u 直接報錯退出
            if ! grep -Fxq "$label" <<<"$current"; then
              echo "跳過：#$NUMBER 上沒有「${label}」"
              continue
            fi

            # 標籤名裡有空格，塞進 URL 前先轉義
            encoded=$(jq -rn --arg name "$label" '$name | @uri')

            if err=$(gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$encoded" 2>&1 >/dev/null); then
              echo "已移除：$label"
            elif grep -q 'HTTP 404' <<<"$err"; then
              # 查完標籤到這一步之間，別人手動摘掉了，當成已經做完
              echo "跳過：「${label}」已經不在了"
            else
              echo "移除「${label}」失敗：$err" >&2
              exit 1
            fi
          done <<<"$PENDING_LABELS"
