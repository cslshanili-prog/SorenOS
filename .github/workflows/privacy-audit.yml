name: 隱私審計 · 外部檢查

# 第一檔：keyless。零 secret，不碰服務器，只驗證「從公網能看到什麼」。
#
# 刻意不掛 pull_request —— fork 出去的 PR 一旦能觸發這個 workflow，
# 等第二檔把 SSH 私鑰放進 secret 之後，就要處理 fork / pull_request_target /
# secret 可見性的一整套麻煩。現在就不給它這個機會。
#
# push 觸發用 paths 限定這個文件自己：改業務代碼不該順手對線上做一次探測。

on:
  schedule:
    # 03:40 UTC。服務器側 umami-backup.timer 是 03:20 UTC（pg_dump + 內部自檢），
    # 留 20 分鐘餘量，讓外部審計跑在它後面。GitHub 的 schedule 常有延遲，無所謂。
    - cron: '40 3 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/privacy-audit.yml'

permissions:
  contents: read

concurrency:
  group: privacy-audit
  cancel-in-progress: false

jobs:
  external:
    name: keyless 外部檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 交叉核對用。vars 不是 secret，fork 裡拿不到值 —— 拿不到就跳過這兩條，不算失敗。
      VAR_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
      VAR_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 外部隱私斷言
        shell: bash
        run: |
          # 刻意不用 set -e：每條 check 都要跑完，最後統一報。
          # 半路夭折的話第一條掛了後面全看不見，而「還有哪些也掛了」恰恰是最要緊的信息。
          set -uo pipefail

          fails=()
          rows=()

          check() { # check <描述> <期望值> <實際值>
            if [[ "$2" == "$3" ]]; then
              printf '  ✅ %-44s %s\n' "$1" "$3"
              rows+=("| ✅ | $1 | \`$3\` | |")
            else
              printf '  ❌ %-44s 期望 %s，實際 %s\n' "$1" "$2" "$3"
              fails+=("$1（期望 $2，實際 $3）")
              rows+=("| ❌ | $1 | \`$3\` | 期望 \`$2\` |")
            fi
          }

          # ─────────────────────────────────────────────────────────────
          # 0. 事實來源：倉庫裡的 docs/analytics.md
          #
          # 實例地址和站點 id 刻意不寫在源碼裡（見 analytics.md「數據發到哪」一節：
          # 硬編碼的話 fork 一構建，他的用戶就會朝這個地址發請求）。全倉庫唯一寫著
          # 這兩個值的地方就是那份文檔 —— 而它同時也是對外的公開承諾，拿它當事實來源
          # 正好：審計的對象本來就是「文檔裡寫的那個實例，行為是否符合文檔裡的承諾」。
          #
          # 副作用是這段解析跟文檔措辭耦合。措辭一改這裡就紅 —— 那是想要的行為，
          # 不是 bug：文檔必須始終寫明數據發去哪。
          # ─────────────────────────────────────────────────────────────
          DOC=docs/analytics.md
          line=$(grep -m1 '自託管的 umami 實例' "$DOC" || true)
          BASE=$(printf '%s' "$line" | grep -oE 'https://[A-Za-z0-9.-]+' | head -1 || true)
          WID=$(printf '%s' "$line" \
                | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
                | head -1 || true)

          if [[ -z "$BASE" || -z "$WID" ]]; then
            echo "::error file=$DOC::沒能解析出實例地址 / 站點 id。文檔措辭是不是改了？"
            {
              echo "## 隱私審計 · 外部檢查"
              echo
              echo "❌ 無法從 \`$DOC\` 解析出實例地址或站點 id，審計沒有事實來源，直接判失敗。"
              echo
              echo "匹配到的行：\`${line:-（沒匹配到）}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          HOST=${BASE#https://}
          echo "事實來源 $DOC → 實例 $BASE ｜ 站點 $WID"
          echo

          # ─────────────────────────────────────────────────────────────
          # 1. 文檔寫的實例，和實際構建注入的，是不是同一個
          # ─────────────────────────────────────────────────────────────
          echo "### 事實來源一致性 ###"
          if [[ -n "${VAR_SCRIPT_URL:-}" ]]; then
            var_host=$(printf '%s' "$VAR_SCRIPT_URL" | sed -E 's#^https?://##; s#/.*##')
            check "Variables 與文檔同一實例" "$HOST" "$var_host"
          else
            echo "  ⏭  UMAMI_SCRIPT_URL 未配置或不可見（fork），跳過"
          fi
          if [[ -n "${VAR_WEBSITE_ID:-}" ]]; then
            check "Variables 與文檔同一站點 id" "$WID" "$VAR_WEBSITE_ID"
          else
            echo "  ⏭  UMAMI_WEBSITE_ID 未配置或不可見（fork），跳過"
          fi
          echo

          # ─────────────────────────────────────────────────────────────
          # 1b. 線上產物核對：CI 審計的實例，就是用戶瀏覽器真正在請求的那個
          #
          # 上面那兩條只證明「文檔 == Variables」，而 Variables 只是構建的輸入。
          # 用戶實際加載的是 GitHub Pages 上那些文件 —— 中間隔著一次構建。
          # 所以這裡直接把線上產物抓下來，在裡面找這兩個值。
          #
          # 具體怎麼抓、為什麼要抓全站而不是只看入口那一個文件，見腳本里的說明。
          # 判定邏輯放在 scripts/ 下有測試守著（scripts/audit-online-bundle.test.ts），
          # 省得它哪天悄悄退化成「只看一個文件、看不見就報沒有」。
          #
          # 只在 Variables 讀得到時跑：讀不到就說明這是 fork 或沒配統計的倉庫，
          # 它的 Pages 上本來就不該有這些值，沒有可核對的對象。
          # ─────────────────────────────────────────────────────────────
          if [[ -n "${VAR_SCRIPT_URL:-}" && -n "${VAR_WEBSITE_ID:-}" ]]; then
            echo "### 線上產物核對 ###"
            owner=${GITHUB_REPOSITORY%%/*}
            repo=${GITHUB_REPOSITORY##*/}
            PAGES="https://${owner}.github.io/${repo}/"
            echo "  Pages: $PAGES ｜ node $(node --version)"

            # 人看的進度走 stderr（直接落進日誌），stdout 是給這裡解析的 JSON。
            bundle_json=$(node scripts/audit-online-bundle.mjs \
              --base "$PAGES" \
              --public-dir public \
              --website-id "$WID" \
              --script-url "$VAR_SCRIPT_URL") || true

            before=${#rows[@]}
            while IFS=$'\t' read -r name expected actual; do
              if [[ -n "$name" ]]; then
                check "$name" "$expected" "$actual"
              fi
            done < <(printf '%s' "$bundle_json" | jq -r '.checks[]? | [.name, .expected, .actual] | @tsv' 2>/dev/null || true)

            # 腳本自己崩了 / 輸出解析不出來時，上面那個循環一條都讀不到，
            # 於是「線上產物」這一整塊悄無聲息地消失，整份審計照樣綠。
            # 這種時候必須留下一條紅的。
            if (( ${#rows[@]} == before )); then
              check "線上產物核對腳本跑通" "yes" "no（沒有可解析的輸出，看上面的報錯）"
            fi
            echo
          fi

          # ─────────────────────────────────────────────────────────────
          # 2. DNS 留痕（不做斷言，只讓每次 run 的日誌裡存下當時解析到哪）
          #
          # 順帶一提：Caddyfile 要求這個域名在 Cloudflare 上是灰雲 / DNS only。
          # 走橙雲的話 Caddy 看到的是 CF 邊緣 IP，/24 截斷會靜默失效。
          # 這裡打出來的 IP 如果哪天變成 CF 段，就是那件事發生了。
          # ─────────────────────────────────────────────────────────────
          echo "### DNS 解析留痕 ###"
          if command -v dig >/dev/null 2>&1; then
            echo "  dig $HOST A    -> $(dig +short "$HOST" A    | paste -sd' ' - || true)"
            echo "  dig $HOST AAAA -> $(dig +short "$HOST" AAAA | paste -sd' ' - || true)"
          else
            echo "  （無 dig，退回 getent）$(getent ahosts "$HOST" | awk '{print $1}' | sort -u | paste -sd' ' - || true)"
          fi
          echo

          # ─────────────────────────────────────────────────────────────
          # 3. 約束 #3：後台沒被公開
          # ─────────────────────────────────────────────────────────────
          echo "### 後台訪問控制 ###"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/websites" || echo ERR)
          check "後台未登錄訪問被拒" "401" "$code"
          echo

          # ─────────────────────────────────────────────────────────────
          # 4. 約束 #2：斷外聯的開關還在（照抄 assert-privacy.sh 第 6 條）
          # ─────────────────────────────────────────────────────────────
          echo "### 斷外聯開關 ###"
          cfg=$(curl -sS --max-time 10 "$BASE/api/config" || echo '{}')
          for k in privateMode telemetryDisabled updatesDisabled; do
            val=$(printf '%s' "$cfg" | jq -r --arg k "$k" '(.[$k] // false) | tostring' 2>/dev/null || echo ERR)
            check "$k" "true" "$val"
          done
          # 約束 #5：tracker 腳本名沒被改成規避攔截器的名字。
          # 缺失和顯式 null 都算 null —— 與 assert-privacy.sh 的判定保持一致。
          tsn=$(printf '%s' "$cfg" | jq -c '.trackerScriptName' 2>/dev/null || echo ERR)
          check "tracker 腳本名未被改動" "null" "$tsn"
          echo

          # ─────────────────────────────────────────────────────────────
          # 5. 約束 #4：數據庫 / 應用端口不對公網
          #
          # 從 GitHub runner 這個純外部視角探。連不通有兩種：
          # 立刻 refused，或者被防火牆丟包一直到 timeout —— 都算 closed。
          #
          # ⚠️ 先探 443 做正對照，這條不能刪。
          # 「連不上 5432」這種否定斷言，在一個出站被攔、或者走 HTTP 代理的環境裡
          # 會無條件成立 —— 探測機制自己壞掉，和端口真的關著，從結果上長得一模一樣，
          # 而且壞的那一側是綠的。443 必須探得通，才說明這台 runner 的 TCP 出站是直連的、
          # 下面兩條 closed 才有意義。（實測：某些沙箱環境裡 /dev/tcp 任何端口都返回
          # 成功，macOS 的 nc -z -w 對被 DROP 的端口超時後也照樣退 0。）
          # ─────────────────────────────────────────────────────────────
          echo "### 端口暴露面 ###"
          probe() { # probe <端口> -> open / closed
            if timeout 5 bash -c "exec 3<>/dev/tcp/$HOST/$1" 2>/dev/null; then
              echo open
            else
              echo closed
            fi
          }
          check "探測通路自檢（443 應可達）"        "open"   "$(probe 443)"
          check "外部連不上 $HOST:5432（postgres）" "closed" "$(probe 5432)"
          check "外部連不上 $HOST:3000（umami）"   "closed" "$(probe 3000)"
          echo

          # ─────────────────────────────────────────────────────────────
          # 6. 彙總到 run 頁面
          # ─────────────────────────────────────────────────────────────
          {
            echo "## 隱私審計 · 外部檢查"
            echo
            echo "實例 \`$BASE\` ｜ 站點 \`$WID\` ｜ $(date -u +%FT%TZ)"
            echo
            echo "| | 檢查項 | 實際 | 備註 |"
            echo "|---|---|---|---|"
            printf '%s\n' "${rows[@]}"
            echo
            if (( ${#fails[@]} == 0 )); then
              echo "**${#rows[@]} 項全部通過。**"
            else
              echo "### ❌ 失敗 ${#fails[@]} 項"
              echo
              printf -- '- %s\n' "${fails[@]}"
              echo
              echo "> 在修好之前，不要對外聲稱這些承諾仍然成立。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          if (( ${#fails[@]} == 0 )); then
            echo "全部通過（${#rows[@]} 項）。"
            exit 0
          fi
          printf '::error::隱私外部審計失敗 %d 項：%s\n' "${#fails[@]}" "${fails[*]}"
          exit 1

  # ═══════════════════════════════════════════════════════════════════
  # 第二檔：SSH 內部檢查
  #
  # 用一把專用 ed25519（只為這件事生成，不復用任何登錄鑰匙）。服務器那側
  # authorized_keys 寫的是 restrict,command=".../audit-entry.sh"：
  # restrict 關掉 pty / 端口轉發 / agent 轉發，command= 讓「請求執行什麼」
  # 這件事失去意義 —— 客戶端發過去的命令原文只會落進 SSH_ORIGINAL_COMMAND，
  # 由 audit-entry.sh 當作 nonce 做三道校驗。鑰匙洩露的場景下，
  # 攻擊者能做的全部就是「觸發一次自檢」。
  #
  # 和 external 刻意不設 needs：一檔掛了另一檔照樣要出結果，
  # 「哪些同時掛了」是排查時最要緊的信息。
  # ═══════════════════════════════════════════════════════════════════
  internal:
    name: SSH 內部檢查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # fork 裡既沒有 Variables 也沒有 secret，跳過而不是紅。
    if: ${{ vars.UMAMI_SCRIPT_URL != '' }}
    permissions:
      contents: read
    env:
      VAR_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
      VAR_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 裝審計鑰匙
        env:
          AUDIT_KEY: ${{ secrets.AUDIT_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUDIT_KEY" > "$HOME/.ssh/audit_key"
          chmod 600 "$HOME/.ssh/audit_key"
          # 主機指紋釘死在倉庫裡，不用 ssh-keyscan 現抓 —— 現抓等於每次都接受
          # 當時碰到的是誰，中間人換了台機器也照樣綠。
          cp infra/known_hosts "$HOME/.ssh/audit_known_hosts"
          echo "已裝載，指紋："
          ssh-keygen -lf "$HOME/.ssh/audit_known_hosts"

      - name: 發髒頭探針並觸發內部自檢
        shell: bash
        run: |
          set -uo pipefail

          HOST=$(printf '%s' "$VAR_SCRIPT_URL" | sed -E 's#^https?://##; s#/.*##')
          BASE="https://$HOST"
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY##*/}
          EV="ci_probe_${GITHUB_RUN_ID}"

          # ── 探針 ──────────────────────────────────────────────────
          # 這一發是整套審計裡唯一「主動製造證據」的動作：故意夾帶一堆偽造的
          # 真實-IP 頭和地理頭，然後到庫裡看它們有沒有滲進去。
          #
          # 兩個坑（都踩過）：
          #   · hostname 必須和 umami 裡 website 的 domain 對得上，否則事件歸不到站點上
          #   · 必須帶瀏覽器 UA。umami 的 bot 過濾是**靜默丟棄**，照樣回 200 ——
          #     所以 http_code 不能當作落庫的證據，落沒落庫只能查庫。
          payload=$(jq -nc \
            --arg w "$VAR_WEBSITE_ID" \
            --arg h "${owner}.github.io" \
            --arg u "/${repo}/" \
            --arg n "$EV" \
            '{type:"event",payload:{website:$w,hostname:$h,language:"en-US",
              referrer:"",screen:"1920x1080",title:"CI privacy probe",url:$u,name:$n}}')

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$BASE/api/send" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'X-Forwarded-For: 203.0.113.7' \
            -H 'X-Real-IP: 198.51.100.9' \
            -H 'CF-Connecting-IP: 203.0.113.7' \
            -H 'True-Client-IP: 203.0.113.7' \
            -H 'CF-IPCity: Mordor' \
            -H 'CF-IPCountry: XX' \
            -H 'CF-Region-Code: Shire' \
            --data "$payload" || echo ERR)
          echo "探針 $EV 已發出（HTTP $code；注意這個碼不代表落庫）"

          # ── SSH ───────────────────────────────────────────────────
          # 請求執行的「命令」就是 run id 本身，服務器那邊只把它當 nonce 收。
          set +e
          ssh -i "$HOME/.ssh/audit_key" \
              -o UserKnownHostsFile="$HOME/.ssh/audit_known_hosts" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "audit@$HOST" "$GITHUB_RUN_ID" > /tmp/audit.out 2>&1
          rc=$?
          set -e
          echo "ssh 退出碼 $rc"
          echo "$rc" > /tmp/audit.rc

          # 自檢正文進日誌；schema 那幾百行摺疊起來，不然正文被淹了。
          sed -n '1,/^===== SCHEMA-BEGIN =====$/p' /tmp/audit.out | sed '$d'
          echo "::group::pg_dump --schema-only（原文）"
          awk '/^===== SCHEMA-BEGIN =====$/{f=1;next} /^===== SCHEMA-END =====$/{f=0} f' /tmp/audit.out
          echo "::endgroup::"

          awk '/^===== SCHEMA-BEGIN =====$/{f=1;next} /^===== SCHEMA-END =====$/{f=0} f' \
            /tmp/audit.out > /tmp/umami-schema.sql
          echo "schema 行數：$(wc -l < /tmp/umami-schema.sql)"

      - name: 核對配置指紋並彙總
        shell: bash
        run: |
          set -uo pipefail

          fails=()
          rows=()
          check() {
            if [[ "$2" == "$3" ]]; then
              printf '  ✅ %-46s\n' "$1"
              rows+=("| ✅ | $1 | |")
            else
              printf '  ❌ %-46s 期望 %s，實際 %s\n' "$1" "$2" "$3"
              fails+=("$1")
              rows+=("| ❌ | $1 | 期望 \`$2\`，實際 \`$3\` |")
            fi
          }

          rc=$(cat /tmp/audit.rc)
          check "內部自檢整體通過（audit-entry 退出碼）" "0" "$rc"

          # ── schema 帳本（第三檔）─────────────────────────────────
          # 只比對、只報告，不往倉庫裡寫。master 要求走 PR，bot 直推會被
          # 分支保護彈回來（GH013），紅的原因還跟隱私無關，純粹是推不上去。
          # 帳本本身留在 artifact + Actions 歷史裡（90 天）。
          #
          # schema 變了就紅，是故意的：新增一張表 / 一個列，正是「多了個能存
          # 敏感數據的地方」最可能的樣子。確認過沒問題的話，把新版存進
          # infra/umami-schema.sql 提交一次，下一輪就恢復綠。
          if [[ -s /tmp/umami-schema.sql ]]; then
            if diff -q infra/umami-schema.sql /tmp/umami-schema.sql >/dev/null 2>&1; then
              check "數據庫 schema 與倉庫帳本一致" "same" "same"
            else
              check "數據庫 schema 與倉庫帳本一致" "same" "changed"
              echo "::group::schema diff"
              diff -u infra/umami-schema.sql /tmp/umami-schema.sql | head -200 || true
              echo "::endgroup::"
              {
                echo
                echo "<details><summary>schema diff（前 200 行）</summary>"
                echo
                echo '```diff'
                diff -u infra/umami-schema.sql /tmp/umami-schema.sql | head -200 || true
                echo '```'
                echo
                echo "</details>"
                echo
                echo "> 確認無害後，把本次 run 的 \`umami-schema\` artifact 存回 \`infra/umami-schema.sql\` 提交一次即可。"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            check "數據庫 schema 與倉庫帳本一致" "same" "（沒拿到 schema）"
          fi

          # ── 配置即代碼 ────────────────────────────────────────────
          # 判定刻意放在這一側：服務器只負責報出自己那幾個文件的 sha256，
          # 基線存在倉庫裡。誰想讓配置漂移而不被發現，就得同時改服務器和 GitHub，
          # 而這兩處的痕跡是分開留的。
          echo "### 線上配置 vs 倉庫 infra/ ###"
          for f in Caddyfile docker-compose.yml assert-privacy.sh audit-entry.sh umami-privacy-trigger.expected.txt; do
            want=$(sha256sum "infra/$f" 2>/dev/null | awk '{print $1}')
            got=$(grep -m1 "^CONFIG-SHA256 $f " /tmp/audit.out | awk '{print $3}')
            check "線上 $f 與倉庫副本一致" "${want:-（倉庫裡沒有）}" "${got:-（沒拿到）}"
          done

          {
            echo "## 隱私審計 · 內部檢查"
            echo
            echo "nonce \`$GITHUB_RUN_ID\` ｜ $(date -u +%FT%TZ)"
            echo
            echo "| | 檢查項 | 備註 |"
            echo "|---|---|---|"
            printf '%s\n' "${rows[@]}"
            echo
            echo "<details><summary>服務器自檢原文</summary>"
            echo
            echo '```'
            sed -n '1,/^===== SCHEMA-BEGIN =====$/p' /tmp/audit.out | sed '$d'
            echo '```'
            echo
            echo "</details>"
            echo
            if (( ${#fails[@]} == 0 )); then
              echo "**全部通過。**"
            else
              echo "### ❌ 失敗 ${#fails[@]} 項"
              echo
              printf -- '- %s\n' "${fails[@]}"
              echo
              echo "> 在修好之前，不要對外聲稱這些承諾仍然成立。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#fails[@]} == 0 )); then
            echo "全部通過。"
            exit 0
          fi
          printf '::error::隱私內部審計失敗 %d 項：%s\n' "${#fails[@]}" "${fails[*]}"
          exit 1

      # 不往倉庫寫之後，這個 artifact 就是 schema 帳本本身了，
      # 保留期跟 Actions 歷史窗口對齊。
      - name: 存檔 schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umami-schema
          path: /tmp/umami-schema.sql
          retention-days: 90
