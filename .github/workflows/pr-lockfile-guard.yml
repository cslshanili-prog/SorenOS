name: 鎖文件檢查

# 只在 PR 動到 pnpm-lock.yaml 時跑，幾秒鐘出結果。
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  check-local-links:
    name: 禁止指向倉庫外的本地依賴
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 腳本零依賴，不用 pnpm install
      - name: 檢查 pnpm-lock.yaml
        run: node scripts/check-lockfile-links.mjs
