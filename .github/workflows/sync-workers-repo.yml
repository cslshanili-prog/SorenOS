name: Sync worker bundles to deploy repo

# 把打好的 worker bundle 推到那個「用戶 fork 來部署」的小倉庫。
#
# 為什麼要單獨一個倉庫：用戶自部署後端時，原來的流程是打開 218KB 的
# worker.bundle.js、全選、複製、粘進 Cloudflare 面板——手機上尤其難受，而且每次
# worker 有更新都要重來一遍。改成 fork 一個只裝 bundle + wrangler.toml 的小倉庫、
# 在 CF 面板連上 Git 之後，更新就只剩 GitHub 上點一下「Sync fork」。
#
# 一次性準備（都在 GitHub 網頁上做得完）：
#   1. 建一個空倉庫，比如 <你的帳號>/sullyos-workers
#   2. 建一個有該倉庫 contents:write 權限的 fine-grained PAT
#   3. 把 PAT 存進本倉庫的 Actions secret：WORKERS_REPO_TOKEN
#   4. 把下面的 TARGET_REPO 改成那個倉庫的 owner/name
#
# 沒配 secret 時這個 workflow 會直接跳過（不報紅），所以先合併再配也行。

on:
  push:
    branches: [main, master]
    # 整個 utils 目錄都算進來，不逐個點名 worker 用到的文件。bundle 實際會打進
    # agenticToolFeedback / xhsMcpClient / sanitize / proxyWorker 這些，靠人工維護一份
    # 清單的話，漏一個不會報錯、只會靜默給用戶同步一個過期的 bundle——正是下面那條
    # 「從源碼重打」想避免的事。放寬的代價只是前端提交也白跑一次構建，而內容沒變時
    # 下面的 git diff 判斷不會產生空提交，用戶那邊不會收到無意義的更新。
    paths:
      - 'worker/**'
      - 'utils/**'
      - 'types.ts'
      - '.github/workflows/sync-workers-repo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-workers-repo
  cancel-in-progress: true

# 部署倉庫的 owner/name 全寫：它跟本倉庫不在同一個帳號下，
# 界面和文檔裡給用戶的 fork 鏈接指的也是這個地址。
env:
  TARGET_REPO: Tosd0/sullyos-workers

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if deploy repo token is not configured
        id: guard
        run: |
          if [ -z "${{ secrets.WORKERS_REPO_TOKEN }}" ]; then
            echo "沒配 WORKERS_REPO_TOKEN，跳過同步（見本文件頂部說明）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.guard.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # 從源碼重新打一遍，而不是直接拿倉庫裡那份已提交的 bundle——避免有人只改了
      # src 忘了跑 build:workers，把過期的包同步給用戶。
      - name: Build worker bundles
        if: steps.guard.outputs.ready == 'true'
        run: pnpm build:workers

      - name: Stage deploy repo contents
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # 用戶會自部署的 worker 才放進去。post-office 是所有用戶共用的後端
          # （客戶端默認指向作者那一個實例），不需要用戶各部署一份，故不同步。
          #
          # 每行是「目錄:入口文件」——mcp-proxy 的入口是手寫的 worker.js，不是
          # build:workers 打出來的 bundle，所以入口名要跟著 wrangler.toml 的 main 走。
          for entry in amsg:worker.bundle.js mcp-proxy:worker.js; do
            name="${entry%%:*}"
            file="${entry##*:}"
            src="worker/$name"
            [ -f "$src/$file" ]         || { echo "缺 $src/$file"; exit 1; }
            [ -f "$src/wrangler.toml" ] || { echo "缺 $src/wrangler.toml"; exit 1; }
            mkdir -p "staging/$name"
            cp "$src/$file"         "staging/$name/$file"
            cp "$src/wrangler.toml" "staging/$name/wrangler.toml"
            # 部署倉庫裡只有打好的入口文件、沒有 src/，所以把 main 改寫成它。
            # 本倉庫那份 wrangler.toml 不動。
            sed -i "s|^main = .*|main = \"$file\"|" "staging/$name/wrangler.toml"
            grep -q "^main = \"$file\"$" "staging/$name/wrangler.toml" \
              || { echo "$name 的 wrangler.toml 沒有 main 行，改寫失敗"; exit 1; }
            # CF 的構建命令：把 D1_DATABASE_ID 構建變量填進 wrangler.toml 的佔位符，
            # 用戶就不用去 GitHub 編輯器改那一行了。每個 worker 目錄一份，因為
            # CF 的 Root directory 指到子目錄、構建命令的 cwd 就是那裡。
            cp worker/deploy-prepare.sh "staging/$name/deploy-prepare.sh"
            chmod +x "staging/$name/deploy-prepare.sh"
            # 「Deploy to Cloudflare」按鈕要的兩份元數據，有就帶上：
            #   .dev.vars.example  部署頁面據此為每個密鑰列一個輸入框
            #   deploy-meta.json   輸入框旁邊的說明文字，到了部署倉庫得叫 package.json
            #
            # 在本倉庫不能直接叫 package.json：worker/* 在 pnpm workspace 裡，多一個
            # package.json 會讓這個目錄變成獨立包，pnpm build:workers 就解析不到依賴了。
            if [ -f "$src/.dev.vars.example" ]; then
              cp "$src/.dev.vars.example" "staging/$name/.dev.vars.example"
            fi
            if [ -f "$src/deploy-meta.json" ]; then
              cp "$src/deploy-meta.json" "staging/$name/package.json"
            fi
          done
          cp docs/self-deploy-workers.md staging/README.md

      - name: Push to deploy repo
        if: steps.guard.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.WORKERS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          target="https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git"
          git clone --depth 1 "$target" deploy-repo
          # 先清掉舊內容再鋪新的：worker 被刪除/改名時目標倉庫不該留殘骸。
          # .git 之外全清；用戶 fork 後自己改的 wrangler.toml 不受影響（那是他們倉庫的事）。
          find deploy-repo -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R staging/. deploy-repo/
          cd deploy-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "worker bundle 沒有變化，不產生空提交。"
            exit 0
          fi
          git commit -m "chore: sync worker bundles from ${{ github.repository }}@${GITHUB_SHA::7}"
          git push
