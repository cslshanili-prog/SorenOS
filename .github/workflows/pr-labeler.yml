name: PR 自動打標籤

# 用 pull_request_target 是為了讓來自 fork 的 PR 也拿得到寫標籤的權限。
# 這裡的兩個 action 都只讀 PR 的文件清單、不檢出也不執行 PR 裡的代碼，所以是安全的。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-by-files:
    name: 按改動文件貼 scope 標籤
    runs-on: ubuntu-latest
    steps:
      - name: 按 .github/labeler.yml 的映射貼標籤
        # https://github.com/actions/labeler
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  label-by-size:
    name: 按改動規模貼大小標籤（不含測試）
    # 排在 scope 標籤之後，避免兩個 job 同時寫標籤互相覆蓋
    needs: [label-by-files]
    runs-on: ubuntu-latest
    if: always()

    # 打標籤走的是 issues API，要額外給 issues 寫權限
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: 統計增刪行數並貼標籤（只算測試以外的改動）
        # https://github.com/CodelyTV/pr-size-labeler
        uses: codelytv/pr-size-labeler@4ec67706cd878fbc1c8db0a5dcd28b6bb412e85a # v1.10.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: '🟢 ■□□□□'
          xs_max_size: '50'
          s_label: '🟢 ■■□□□'
          s_max_size: '500'
          m_label: '🟡 ■■■□□'
          m_max_size: '1000'
          l_label: '🟠 ■■■■□'
          l_max_size: '2500'
          xl_label: '🔴 ■■■■■'
          # 超大 PR 只貼標籤，不攔合併
          fail_if_xl: 'false'
          message_if_xl: ''
          # 這個標籤衡量的是「需要人肉 review 的實現改動有多大」，所以下面幾類都不計入：
          #   1. 構建產物和鎖文件 —— 不然一次 pnpm install 就直接頂到 XL
          #   2. 測試文件 —— 補測試是好事，不該讓 PR 因為測試寫得多就被貼成大 PR
          # 匹配規則是 action 內部的 bash `[[ $filename == $pattern ]]`（見 src/github.sh），
          # 注意它是普通字符串通配、不是 pathname 展開，所以 `*` 會跨 `/`：
          # `*.test.ts` 能蓋住 utils/memoryPalace/embedding.test.ts 這種嵌套路徑，不用寫 `**`。
          files_to_ignore: |
            "pnpm-lock.yaml"
            "public/*.bundle.js"
            "dist/*"
            "*.test.ts"
            "*.test.tsx"
            "*.spec.ts"
            "*.spec.tsx"
            "test/*"
            "*/test/*"
            "tests/*"
            "*/tests/*"
            "__tests__/*"
            "*/__tests__/*"
            "test-setup.ts"
            "vitest.config.ts"
