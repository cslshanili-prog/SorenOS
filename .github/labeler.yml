# PR 改了哪些文件 → 自動貼哪些 scope 標籤
#
# 規則說明：
#   - any-glob-to-any-file：改動裡只要有一個文件命中，就貼這個標籤
#   - all-globs-to-all-files：改動裡所有文件都命中，才貼這個標籤
#   - 只加不刪（沒開 sync-labels），手動貼的標籤不會被沖掉
#
# 新增標籤前先確認倉庫裡已經有同名 label，否則會被自動創建成灰色無描述的。

'scope: amsg':
  - changed-files:
      - any-glob-to-any-file:
          - 'worker/amsg/**'
          - 'utils/amsg*'
          - 'utils/activeMsg*'
          - 'components/chat/ActiveMsg*'
          - 'components/settings/ActiveMsg*'
          - 'utils/instantTraceLog*'
          - 'worker/proactive-push/**'
          - 'utils/proactive*'

'scope: pushSubscription':
  - changed-files:
      - any-glob-to-any-file:
          - 'utils/pushSubscribeShared.ts'
          - 'utils/pushVapid.ts'

'scope: sw':
  - changed-files:
      - any-glob-to-any-file:
          - 'worker/sw-keep-alive.ts'
          - 'public/sw-keep-alive.js'
          - 'public/*.bundle.js'
          - 'utils/swVersion.ts'
          - 'utils/*WorkerVersion.ts'

'scope: indexedDb':
  - changed-files:
      - any-glob-to-any-file:
          - 'utils/db.ts'
          - 'utils/db.*.ts'

'scope: xhs':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/Xhs*.tsx'
          - 'worker/xhs-lite/**'

'scope: mcd':
  - changed-files:
      - any-glob-to-any-file:
          - 'components/mcd/**'
          - 'utils/mcd*'

'scope: vrWorld':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/VRWorldApp.tsx'

'scope: diary':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/JournalApp.tsx'

# 整個 PR 只動了文檔才算文檔 PR，順手改一句 README 不會被貼上
documentation:
  - changed-files:
      - all-globs-to-all-files:
          - '**/*.md'
