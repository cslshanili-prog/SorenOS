# /opt/umami/docker-compose.yml
# umami v3.2.0 (postgresql) — SullyOS 自託管
# 約束對照：
#   #2 不接第三方 → PRIVATE_MODE / DISABLE_TELEMETRY / DISABLE_UPDATES
#   #4 數據庫不對公網 → db 服務下方**沒有** ports:，僅走 compose 內部網絡
#   #5 不改 tracker 腳本名 → 不設置 TRACKER_SCRIPT_NAME / COLLECT_API_ENDPOINT
#   #3 後台不公開 → 不設置 DISABLE_LOGIN

name: umami

services:
  umami:
    # 按 digest 固定。ghcr 上 v3 沒有版本 tag，只有 postgresql-latest，
    # 該 digest 對應 image created=2026-06-24T23:37:15Z，與 v3.2.0 發佈時間一致。
    image: ghcr.io/umami-software/umami@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
    container_name: umami
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env                      # APP_SECRET / POSTGRES_PASSWORD，權限 600
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami

      # —— 隱私 / 斷外聯 ——
      PRIVATE_MODE: 1             # 關閉所有對外網絡調用（含 favicon 走 duckduckgo）
      DISABLE_TELEMETRY: 1        # 關閉 i.umami.is 遙測像素
      DISABLE_UPDATES: 1          # 關閉 api.umami.is/v1/updates 版本檢查

      # —— IP 處理 ——
      # 只信任 Caddy 注入的這一個頭。umami 的 getIpAddress() 會優先讀它並直接返回，
      # 不再去看 x-forwarded-for / cf-connecting-ip / true-client-ip 等 15 個可偽造頭。
      CLIENT_IP_HEADER: X-Anon-IP

      # —— 其它 ——
      REMOVE_TRAILING_SLASH: 1
      DISABLE_BOT_CHECK: 0
      NODE_OPTIONS: --max-old-space-size=384   # 這台機器只有 956MB
      TZ: UTC
    ports:
      # 只綁回環。Docker 發佈端口會繞過 ufw，綁 127.0.0.1 才是真正的隔離。
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    container_name: umami-db
    restart: unless-stopped
    # ⚠️ 這裡沒有 ports: —— 這是約束 #4 的唯一保證，請勿添加
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - timezone=UTC
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  umami-db-data:
    name: umami-db-data
