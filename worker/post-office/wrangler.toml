name = "sullyos-post-office"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# wrangler deploy 會用本地這份配置整體覆蓋 Cloudflare 面板上的設置——
# 不顯式寫這段，面板裡手動開的 Workers Logs（實時日誌）會被一起關掉。
[observability]
enabled = true

[observability.logs]
enabled = true

# 彼方虛擬郵局 —— 跨用戶漂流信的共享後端。
#
# 這是一個【所有用戶共用】的後端：客戶端默認指向你部署的這一個實例
# （如 https://noir2.cc.cd/po），其他用戶無需任何配置即可互相通信。
#
# 部署：
#   1) wrangler d1 create sullyos-post-office       # 拿到 database_id
#   2) 把 database_id 填到下面 [[d1_databases]]
#   3) wrangler deploy
#   （表結構 Worker 會自動建，加性、不破壞老數據；不必手動跑 schema.sql）
#
# Secrets（用 `wrangler secret put <名字>` 設置，別寫進本文件）：
#   ADMIN_TOKEN   管理員令牌；未配置則 /admin/* 一律 503 關閉
#   PO_IP_SALT    限流哈希鹽；用於不可逆化 IP，建議配置
#
# 路由到 noir2.cc.cd/po/*（二選一）：
#   A. 單獨部署本 worker，然後在 Cloudflare 給 noir2.cc.cd/po/* 加一條 Route 指向它；
#   B. 或把 src/index.ts 的 fetch 邏輯並進你現有的 noir2 worker（按 path 結尾匹配，
#      與現有 push 路由不衝突）。

[[d1_databases]]
binding = "DB"
database_name = "sullyos-post-office"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 可選環境變量（非密鑰，可放這裡）：
[vars]
PO_MAX_REPLIES = "3"      # 一封信最多被幾個設備回信
PO_DISLIKE_LIMIT = "5"    # 點踩(=舉報)數達此值即自動刪信
# 正文上限固定 400 字（按字符，1 漢字/標點=1 字），見 src/index.ts MAX_CONTENT
# PO_RATE_LETTERS = "5"   # 每 IP 每 5 小時投信上限（窗口固定 5 小時）
# PO_RATE_REPLIES = "60"  # 每 IP 每分鐘回信上限
# PO_RATE_VOTES   = "120" # 每 IP 每分鐘投票上限
