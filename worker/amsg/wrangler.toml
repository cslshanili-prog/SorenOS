name = "sullyos-amsg"
# 已經 esbuild 打好的整包（pnpm build:workers 產出），wrangler 直接發它，
# 不需要在部署側再裝依賴、再構建一次。
main = "worker.bundle.js"
compatibility_date = "2026-01-01"
# amsg-server 2.6.0-next.2 起全 Web Crypto，不需要 nodejs_compat。

# 角色到點調用戶自配的 MCP 服務器時要走公網。缺這個 flag，發往同一個 Cloudflare
# 帳號/區域下的地址（自己部署的 mcp-proxy 就是這種）會被當成內網調用直接拒掉，
# worker 側看到的是 404 + error code 1042，角色那邊表現為「工具連不上」。
# 與 observability 同理：wrangler deploy 用本地這份配置整體覆蓋面板設置，
# 不寫在這裡的話，面板上手動加過的這個 flag 會被下一次 deploy 沖掉。
compatibility_flags = ["global_fetch_strictly_public"]

# 部署時保留面板上手填的環境變量。
#
# wrangler 默認「先刪光所有 vars，再按配置文件裡的 [vars] 重設」，而這份配置根本沒有
# [vars] 段——於是每次部署都會把面板上手加的明文變量清空。加密的 Secret 不受影響，
# 但用戶在面板上很容易把 AMSG_MASTER_KEY 存成 Text：那樣一來它撐到下一次部署就沒了，
# worker 全線 503，而重新生成的又是另一串——之前加密存進 D1 的任務就再也解不開。
keep_vars = true

# wrangler deploy 會用本地這份配置整體覆蓋 Cloudflare 面板上的設置——
# 不顯式寫這段，面板裡手動開的 Workers Logs（實時日誌）會被一起關掉。
# amsg2 排障（[amsg:expire-skip] / [amsg:agentic] / [amsg:fire-state-missing]
# 這些日誌）全靠它，所以這裡顯式聲明成開。
[observability]
enabled = true

[observability.logs]
enabled = true

# 主動消息 2.0 的單用戶後端：定時任務存 D1，到點由 Cron Trigger 推送。
#
# 部署：
#   1) wrangler d1 create sullyos-amsg      # 拿到 database_id
#   2) 把 database_id 填到下面
#   3) 設密鑰（見文末），然後 wrangler deploy
#   （表結構不用手動建：前端點「連接」時 POST /init-tenant 會冪等創建）

[[d1_databases]]
binding = "DB"
database_name = "sullyos-amsg"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 即時對話的起跳器。用戶按下發送後，這條聊天在它的 alarm 裡生成 —— 那是一次獨立
# invocation，有 15 分鐘牆鍾，跟已經回了 202 的那個請求徹底脫鉤。
# 不用手動建資源：namespace 會隨 Worker 上傳一起創建。
[[durable_objects.bindings]]
name = "INSTANT_TICK"
class_name = "InstantTickDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstantTickDO"]

# 每分鐘查一次到點任務（UTC）。這是主動消息唯一的投遞觸發方式——
# 沒有 send-notifications 這類 HTTP 端點，關掉 cron 等於整個功能停擺。
[triggers]
crons = ["* * * * *"]

# Secrets（用 `wrangler secret put <名字>` 或面板設置，別寫進本文件）：
#   AMSG_MASTER_KEY     64 位 hex；SullyOS 設置頁能一鍵生成
#   VAPID_PUBLIC_KEY    必須和 SullyOS「推送憑據 (VAPID)」面板裡的是同一對，
#   VAPID_PRIVATE_KEY   否則 worker 用別的密鑰對籤推送會 403
#   VAPID_EMAIL         可選；缺則回退 mailto: 默認值
#   AMSG_SERVER_TOKEN   可選；配了則所有端點強制校驗 X-Client-Token
