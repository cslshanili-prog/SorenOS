name = "sullyos-mcp-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# 部署時保留面板上手填的環境變量。wrangler 默認「先刪光所有 vars，再按配置裡的
# [vars] 重設」，而這份配置沒有 [vars] 段——每次部署都會把面板上手加的明文變量清空。
# 加密的 Secret 不受影響，但 PROXY_KEY 存成 Text 的話撐到下一次部署就沒了，
# 表現是防白嫖密鑰悄悄失效（代理照常能用，所以沒人會發現）。
keep_vars = true

# wrangler deploy 會用本地這份配置整體覆蓋 Cloudflare 面板上的設置——
# 不顯式寫這段，面板裡手動開的 Workers Logs（實時日誌）會被一起關掉。
[observability]
enabled = true

[observability.logs]
enabled = true

# 可選：防白嫖密鑰。部署後執行
#   wrangler secret put PROXY_KEY
# 然後在 SullyOS 設置的「代理密鑰」裡填同一個值。
