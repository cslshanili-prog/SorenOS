## Proactive Push Accelerator — Cloudflare Worker config
##
## 作用：給主動消息 1.0 提供"到點喊醒瀏覽器"能力。cron 每分鐘掃一次
## D1，對活著的訂閱發 web-push。Worker 全程不接觸聊天內容，所有 AI
## 生成都在瀏覽器本地完成。

name = "proactive-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

## wrangler deploy 會用本地這份配置整體覆蓋 Cloudflare 面板上的設置——
## 不顯式寫這段，面板裡手動開的 Workers Logs（實時日誌）會被一起關掉。
[observability]
enabled = true

[observability.logs]
enabled = true

## 部署前需要把下面 database_id 換成你 `wrangler d1 create proactive-db`
## 輸出的真實 id。
[[d1_databases]]
binding = "DB"
database_name = "proactive-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

## 每分鐘掃一次即可；30 分鐘間隔的主動消息粒度完全夠用。
[triggers]
crons = ["* * * * *"]

## 非 secret 的環境變量放這裡；VAPID 私鑰用 `wrangler secret put` 設置。
[vars]
VAPID_SUBJECT = "mailto:replace-with-your-email@example.com"
## 客戶端調用前加這個共享 token（寫進 app 設置裡）。留空則不校驗，
## 不推薦線上裸跑——別人可以拿你的 cron 發垃圾 push 給其他訂閱者。
CLIENT_TOKEN = ""
## 活心跳窗口（毫秒）。超過這個時長沒收到 heartbeat 就不再給該訂閱發
## wake push，避免"沒 tab 還亂彈通知"。默認 5 分鐘。
HEARTBEAT_WINDOW_MS = "300000"
